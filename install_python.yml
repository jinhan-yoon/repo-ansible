---
- name: "Install Python 3.11 on Rocky 8/9 and 3.10 on Ubuntu"
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    # ---------------------------------------------------------
    # 1. Ubuntu 계열 (기존 동일)
    # ---------------------------------------------------------
    - name: "Ubuntu: Install Python 3.10"
      block:
        - name: "Apt Update and Install 3.10"
          apt:
            name: ["software-properties-common", "python3.10", "python3.10-distutils"]
            state: present
            update_cache: yes
        - name: "Link Python 3.10"
          shell: |
            update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
            update-alternatives --set python3 /usr/bin/python3.10
      when: ansible_os_family == "Debian"

    # ---------------------------------------------------------
    # 2. Rocky / RHEL 계열 (8.10 및 9.x 공통)
    # ---------------------------------------------------------
    - name: "RedHat Family: Install Python 3.11"
      block:
        - name: "Rocky: Install Python 3.11 using command (Avoid DNF module error)"
          command: dnf install -y python3.11 python3.11-devel python3-dnf
          register: dnf_result
          changed_when: "'Nothing to do' not in dnf_result.stdout"

        - name: "Rocky: Update Symbolic Link to 3.11"
          file:
            src: /usr/bin/python3.11
            dest: /usr/bin/python3
            state: link
            force: yes
      when: ansible_os_family == "RedHat"

    # ---------------------------------------------------------
    # 3. 결과 확인
    # ---------------------------------------------------------
    - name: "Final Version Check"
      command: python3 --version
      register: final_ver
      changed_when: false

    - name: "Print Summary"
      debug:
        msg: "Host {{ inventory_hostname }} is now using {{ final_ver.stdout }}"
